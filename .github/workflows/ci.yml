name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .expo/types/router.d.ts is untracked; `expo customize tsconfig.json` is the
      # documented CI way to generate it, and the script asserts the file exists.
      - run: pnpm run routes:types
      # The contract is vendored (src/contracts), so CI needs no backend.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      # Icon/splash PNGs are committed; make sure they match their SVG sources.
      - run: pnpm run generate-assets && git diff --exit-code -- assets/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm exec expo prebuild --platform all --no-install --clean
      - run: sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro smoke on the emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          # The runner executes each script line separately, so the single
          # retry of a flaky emulator run has to fit on one line.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/smoke.yml || maestro test .maestro/smoke.yml

  # The post-init shell must stay green: strip the demo and run the same gate.
  init-project-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/init-project.mjs ci-shell
      - run: |
          test ! -f LICENSE || { echo "LICENSE not deleted"; exit 1; }
          ! grep -q '^## License' README.md || { echo "README License section not stripped"; exit 1; }
      # After stripping routes, regenerate the route types before checking them.
      - run: pnpm run routes:types
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm exec expo prebuild --platform all --no-install --clean
      - run: sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - run: |
          curl -Ls "https://get.maestro.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro smoke on the emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          # The runner executes each script line separately, so the single
          # retry of a flaky emulator run has to fit on one line.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/smoke.yml || maestro test .maestro/smoke.yml
